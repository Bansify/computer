name: Workflow validation

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    name: Validate GitHub Actions workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: false
      - name: Install pinned actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Test release version allocation
        run: python3 -m unittest discover -s .github/scripts/tests -v
      - name: Check workflow syntax and expressions
        shell: bash
        run: |
          set +e
          # GitHub supports queue: max; actionlint v1.7.12 does not recognize it yet.
          # Ignore only that parser diagnostic, not other concurrency or workflow errors.
          actionlint -no-color -ignore 'unexpected key "queue" for "concurrency" section' > actionlint.log 2>&1
          result=$?
          cat actionlint.log
          if [ "$result" -ne 0 ]; then
            python3 - <<'PYCODE'
          from pathlib import Path
          text = Path('actionlint.log').read_text(errors='replace')[:12000]
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error::{text}')
          PYCODE
          fi
          exit "$result"
