name: Android CI

on:
  push:
    branches: ['arena/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, unit tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        shell: bash
        run: |
          set +e
          ./gradlew assembleDebug assembleRelease bundleRelease testDebugUnitTest lintDebug --no-daemon > build.log 2>&1
          result=$?
          cat build.log
          if [ "$result" -ne 0 ]; then
            tail -n 60 build.log | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit "$result"
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ci-reports
          path: |
            app/build/reports/
            app/build/outputs/lint-results-*.xml
          if-no-files-found: ignore
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
